[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqm-rag"
version = "0.1.0"
description = "RAG chatbot over the IQM Help Center"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openai>=3.0",
    "chromadb>=1.5",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
